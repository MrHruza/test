<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MystiLand - Minecraft Server</title>
    <link rel="icon" type="image/png" href="https://github.com/user-attachments/assets/bdd5da67-7841-40f2-a218-3483f6de0bda">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* Animace načítání webu */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Horní panel */
        header {
            background-color: #121624;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 2px solid #1e2640;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-container img {
            height: 40px;
            object-fit: contain;
        }

        .logo-container span {
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* Navigace: Obchod uprostřed, 2 a 2 po stranách */
        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: #a0aec0;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            transition: color 0.2s, transform 0.2s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #ffffff;
            transform: translateY(-1px);
        }

        .store-btn {
            background: linear-gradient(135deg, #6b46c1, #553c9a);
            color: white !important;
            padding: 10px 22px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(107, 70, 193, 0.4);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #a0aec0;
            background: #1a2035;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #2d3748;
        }

        .user-section img {
            width: 28px;
            height: 28px;
            border-radius: 4px;
        }

        /* Hlavní úvodní sekce s pozadím */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(11, 15, 25, 0.5), rgba(11, 15, 25, 0.8)), url('https://github.com/user-attachments/assets/775b273f-837e-4146-ba75-34cd58d73fac') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 70px;
            position: relative;
        }

        /* Animace vznášení loga nahoru a dolů */
        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .hero-logo {
            max-width: 420px;
            width: 100%;
            margin-bottom: 15px;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
            animation: floatLogo 4s ease-in-out infinite;
        }

        .hero-subtitle {
            font-size: 18px;
            color: #cbd5e0;
            margin-bottom: 30px;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .hero-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.6);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .btn-ip {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background-color 0.2s, transform 0.2s, border-color 0.2s;
        }

        .btn-ip:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Moderní notifikační rámeček */
        .notification {
            position: fixed;
            bottom: 35px;
            right: 35px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 14px 26px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(120px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://github.com/user-attachments/assets/bdd5da67-7841-40f2-a218-3483f6de0bda" alt="MystiLand Logo">
            <span>MystiLand</span>
        </div>
        
        <nav>
            <ul>
                <li><a href="#" class="active">Úvod</a></li>
                <li><a href="#">Pravidla</a></li>
                
                <li><a href="#" class="store-btn">Obchod</a></li>
                
                <li><a href="#">Wiki</a></li>
                <li><a href="#">Admin Team</a></li>
            </ul>
        </nav>

        <div class="user-section">
            <span>NEPŘIHLÁŠEN</span>
            <img src="https://crafthead.net/avatar/steve/32" alt="Steve Avatar">
        </div>
    </header>

    <section class="hero">
        <img src="https://github.com/user-attachments/assets/775b273f-837e-4146-ba75-34cd58d73fac" alt="MystiLand Hlavní Logo" class="hero-logo">
        
        <p class="hero-subtitle">Vítejte na oficiálním webu Minecraft serveru MystiLand!</p>
        
        <div class="hero-buttons">
            <a href="#zacit" class="btn-primary">Chci jít hrát!</a>
            <button class="btn-ip" onclick="copyIP()">📋 play.mystiland.eu</button>
        </div>
    </section>

    <div id="notification" class="notification">
        <span>✨</span> IP adresa byla úspěšně zkopírována do schránky!
    </div>

    <script>
        function copyIP() {
            const ip = "play.mystiland.eu";
            navigator.clipboard.writeText(ip).then(() => {
                const notification = document.getElementById("notification");
                notification.classList.add("show");
                
                setTimeout(() => {
                    notification.classList.remove("show");
                }, 3500);
            });
        }
    </script>
</body>
</html>
