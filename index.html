<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MystiLand - Minecraft Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Horní panel */
        header {
            background-color: #121624;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 2px solid #1e2640;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo-container img {
            height: 45px;
            object-fit: contain;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: #a0aec0;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #ffffff;
        }

        .store-btn {
            background: linear-gradient(135deg, #6b46c1, #553c9a);
            color: white !important;
            padding: 8px 18px;
            border-radius: 20px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #a0aec0;
        }

        .user-section img {
            width: 32px;
            height: 32px;
            border-radius: 4px;
        }

        /* Hlavní úvodní sekce */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('https://github.com/user-attachments/assets/775b273f-837e-4146-ba75-34cd58d73fac') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 70px;
            position: relative;
        }

        .hero-logo {
            max-width: 350px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .hero-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(180, 83, 9, 0.4);
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .btn-ip {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background-color 0.2s;
        }

        .btn-ip:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Notifikační rámeček */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Horní panel -->
    <header>
        <div class="logo-container">
            <!-- Sem si můžeš dát odkaz na svoje malé logo -->
            <span style="font-weight: bold; font-size: 18px; color: #fff;">MystiLand</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Úvod</a></li>
                <li><a href="#">Pravidla</a></li>
                <li><a href="#">Wiki</a></li>
                <li><a href="#">Admin Team</a></li>
                <li><a href="#" class="store-btn">Obchod</a></li>
            </ul>
        </nav>
        <div class="user-section">
            <span>NEPŘIHLÁŠEN</span>
            <img src="https://crafthead.net/avatar/steve/32" alt="Steve Avatar">
        </div>
    </header>

    <!-- Úvodní sekce -->
    <section class="hero">
        <!-- Místo obrázku níže vlož odkaz na své hlavní logo MystiLand -->
        <h1 style="font-size: 48px; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.8);">MystiLand</h1>
        
        <div class="hero-buttons">
            <a href="#zacit" class="btn-primary">Chci jít hrát!</a>
            <button class="btn-ip" onclick="copyIP()">📋 play.mystiland.eu</button>
        </div>
    </section>

    <!-- Notifikační rámeček -->
    <div id="notification" class="notification">IP adresa byla zkopírována do schránky!</div>

    <script>
        function copyIP() {
            const ip = "play.mystiland.eu";
            navigator.clipboard.writeText(ip).then(() => {
                const notification = document.getElementById("notification");
                notification.classList.add("show");
                
                setTimeout(() => {
                    notification.classList.remove("show");
                }, 3000);
            });
        }
    </script>
</body>
</html>
